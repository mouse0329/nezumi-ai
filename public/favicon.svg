<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#fff" stroke-width="1"/>

    <!-- AI brain/neural network representation -->
    <g fill="#fff" opacity="0.9">
        <!-- Central node -->
        <circle cx="16" cy="16" r="3"/>

        <!-- Connecting nodes -->
        <circle cx="10" cy="10" r="2"/>
        <circle cx="22" cy="10" r="2"/>
        <circle cx="10" cy="22" r="2"/>
        <circle cx="22" cy="22" r="2"/>

        <!-- Connection lines -->
        <line x1="13" y1="13" x2="16" y2="16" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
        <line x1="19" y1="13" x2="16" y2="16" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
        <line x1="13" y1="19" x2="16" y2="16" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
        <line x1="19" y1="19" x2="16" y2="16" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Mouse silhouette (nezumi = mouse in Japanese) -->
    <g fill="#fff" opacity="0.8">
        <ellipse cx="16" cy="24" rx="4" ry="2"/>
        <path d="M12 20 Q16 18 20 20 L20 22 Q16 24 12 22 Z"/>
    </g>
</svg>